# Dependabot configuration
# Reference: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
    - package-ecosystem: 'github-actions'
      directory: '/'
      schedule:
          interval: 'weekly'

    - package-ecosystem: 'npm'
      directory: '/'
      schedule:
          interval: 'weekly'
      versioning-strategy: 'increase'
      cooldown:
          default-days: 7
      ignore:
          # types follow the minimum Node runtime (engines.node >= 24, user decision 2026-10-10)
          - dependency-name: '@types/node'
            update-types:
                - 'version-update:semver-major'
