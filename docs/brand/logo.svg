<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>ioBroker.idm-modbus</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b5fa5"/>
      <stop offset="1" stop-color="#0a9396"/>
    </linearGradient>
    <linearGradient id="casing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dfe9f2"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- heat pump casing -->
  <rect x="64" y="132" width="262" height="248" rx="30" fill="url(#casing)"/>
  <rect x="64" y="132" width="262" height="40" rx="20" fill="#cfdbe7"/>
  <!-- fan -->
  <circle cx="195" cy="262" r="92" fill="#eef3f8" stroke="#9fb4c8" stroke-width="6"/>
  <g transform="translate(195 262)" fill="#0b5fa5">
    <path d="M0 0 C 20 -22 52 -70 14 -86 C -18 -66 -22 -24 0 0 Z" transform="rotate(0)"/>
    <path d="M0 0 C 20 -22 52 -70 14 -86 C -18 -66 -22 -24 0 0 Z" transform="rotate(72)"/>
    <path d="M0 0 C 20 -22 52 -70 14 -86 C -18 -66 -22 -24 0 0 Z" transform="rotate(144)"/>
    <path d="M0 0 C 20 -22 52 -70 14 -86 C -18 -66 -22 -24 0 0 Z" transform="rotate(216)"/>
    <path d="M0 0 C 20 -22 52 -70 14 -86 C -18 -66 -22 -24 0 0 Z" transform="rotate(288)"/>
    <circle r="15" fill="#073f6e"/>
  </g>
  <!-- heat rising on the right -->
  <g fill="none" stroke="#ffb703" stroke-width="16" stroke-linecap="round">
    <path d="M366 330 C 340 296 392 262 366 228 C 340 194 392 160 366 126"/>
    <path d="M414 350 C 388 316 440 282 414 248 C 388 214 440 180 414 146" stroke="#fb8500"/>
  </g>
  <!-- bus line with three nodes (Modbus) -->
  <g stroke="#ffffff" stroke-width="12" stroke-linecap="round" fill="#ffffff">
    <path d="M90 430 H 422" fill="none"/>
    <circle cx="110" cy="430" r="15"/>
    <circle cx="256" cy="430" r="15"/>
    <circle cx="402" cy="430" r="15"/>
